<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin Login — SB Claveria</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#0a1f44 0%,#1e4d8c 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.card{background:#fff;border-radius:16px;padding:48px 40px;max-width:420px;width:100%;box-shadow:0 24px 80px rgba(0,0,0,.3);}
.seal{width:72px;height:72px;background:#c9a227;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:1.8rem;color:#0a1f44;font-weight:800;margin:0 auto 16px;border:3px solid #e8be4b;}
h1{font-family:'Playfair Display',serif;color:#0a1f44;font-size:1.35rem;text-align:center;margin-bottom:4px;}
.subtitle{color:#64748b;font-size:.84rem;text-align:center;margin-bottom:28px;}
.alert{border-radius:8px;padding:12px 14px;font-size:.83rem;margin-bottom:18px;display:none;align-items:flex-start;gap:8px;}
.alert.show{display:flex;}
.alert-error{background:#fee2e2;border:1px solid #fca5a5;color:#b91c1c;}
.alert-success{background:#dcfce7;border:1px solid #86efac;color:#15803d;}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:6px;}
.field-wrap{position:relative;}
.field input{width:100%;padding:11px 14px 11px 38px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:.9rem;font-family:inherit;outline:none;transition:.2s;color:#1e293b;}
.field input:focus{border-color:#1e4d8c;box-shadow:0 0 0 3px rgba(30,77,140,.1);}
.field input.error{border-color:#dc2626;}
.field i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.85rem;}
.toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#94a3b8;cursor:pointer;font-size:.85rem;padding:2px;}
.btn-login{width:100%;padding:13px;background:#0a1f44;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
.btn-login:hover{background:#1e4d8c;}
.btn-login:disabled{opacity:.6;cursor:not-allowed;}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#94a3b8;font-size:.78rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:#e2e8f0;}
.btn-github{width:100%;padding:12px;background:#24292e;color:#fff;border:none;border-radius:8px;font-size:.88rem;font-weight:600;font-family:inherit;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-github:hover{background:#3d3d3d;}
.btn-github.disabled{opacity:.45;cursor:not-allowed;}
.hint{font-size:.75rem;color:#94a3b8;text-align:center;margin-top:20px;line-height:1.6;}
.hint strong{color:#475569;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="seal">SB</div>
  <h1>Sangguniang Bayan</h1>
  <p class="subtitle">Claveria, Masbate — Admin Portal</p>

  <div class="alert alert-error" id="errAlert">
    <i class="fas fa-circle-exclamation"></i>
    <span id="errMsg">Invalid username or password.</span>
  </div>
  <div class="alert alert-success" id="okAlert">
    <i class="fas fa-check-circle"></i>
    <span>Login successful! Redirecting…</span>
  </div>

  <!-- Password login form -->
  <form onsubmit="doLogin(event)">
    <div class="field">
      <label>Username</label>
      <div class="field-wrap">
        <i class="fas fa-user"></i>
        <input type="text" id="username" placeholder="e.g. admin" autocomplete="username" required/>
      </div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="field-wrap">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required/>
        <button type="button" class="toggle-pw" onclick="togglePw()" tabindex="-1">
          <i class="fas fa-eye" id="pwEyeIcon"></i>
        </button>
      </div>
    </div>
    <button class="btn-login" type="submit" id="loginBtn">
      <div class="spinner" id="spinner"></div>
      <span id="loginBtnText"><i class="fas fa-sign-in-alt"></i> Sign In</span>
    </button>
  </form>

  <div class="divider">or</div>

  <button class="btn-github" id="ghBtn" onclick="loginWithGitHub()">
    <i class="fab fa-github"></i>
    <span id="ghBtnText">Sign in with GitHub</span>
  </button>

  <div class="hint">
    Default credentials: <strong>admin</strong> / <strong>Admin@2025</strong><br>
    Please change your password after first login.
  </div>
</div>

<script>
const API = window.location.origin;

async function doLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  hideAlerts();
  setLoading(true);

  try {
    const res  = await fetch(`${API}/api/auth/login`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ username, password }),
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || 'Login failed. Please try again.');
      setLoading(false);
      return;
    }

    // Success
    localStorage.setItem('sb_token', data.token);
    document.getElementById('okAlert').classList.add('show');
    setTimeout(() => { window.location.href = 'index.html'; }, 800);

  } catch (err) {
    showError('Cannot connect to server. Make sure the backend is running on port 3000.');
    setLoading(false);
  }
}

function loginWithGitHub() {
  const btn = document.getElementById('ghBtn');
  const txt = document.getElementById('ghBtnText');
  txt.textContent = 'Redirecting to GitHub…';
  btn.disabled = true;
  setTimeout(() => { window.location.href = `${API}/api/auth/github`; }, 200);
}

function togglePw() {
  const input = document.getElementById('password');
  const icon  = document.getElementById('pwEyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.className = 'fas fa-eye-slash';
  } else {
    input.type = 'password';
    icon.className = 'fas fa-eye';
  }
}

function setLoading(on) {
  document.getElementById('loginBtn').disabled    = on;
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('loginBtnText').style.display = on ? 'none' : 'flex';
}

function showError(msg) {
  document.getElementById('errMsg').textContent = msg;
  document.getElementById('errAlert').classList.add('show');
}

function hideAlerts() {
  document.getElementById('errAlert').classList.remove('show');
  document.getElementById('okAlert').classList.remove('show');
}

// Handle GitHub OAuth redirect with token
const params = new URLSearchParams(window.location.search);
const token  = params.get('token');
const error  = params.get('error');

if (token) {
  localStorage.setItem('sb_token', token);
  window.location.replace('index.html');
} else if (error) {
  const msgs = {
    missing_client_id: 'GitHub OAuth is not configured. Please use username/password login instead.',
    state_mismatch:    'Security error during GitHub login. Please try again.',
    auth_failed:       'GitHub authentication failed. Use username/password login instead.',
    no_code:           'GitHub did not return a code. Please try again.',
  };
  showError(msgs[error] || `GitHub error: ${error}. Try username/password login.`);
}
if (error || token) history.replaceState({}, '', location.pathname);
</script>
</body>
</html>
